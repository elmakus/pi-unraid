services:
  pi:
    build:
      context: .
    image: pi-unraid:local
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      PI_UID: "${PI_UID:-1000}"
      PI_GID: "${PI_GID:-1000}"
      TZ: Europe/Zurich
      PI_CODEX_LB_BASE_URL: "${PI_CODEX_LB_BASE_URL:-http://host.docker.internal:2455/v1}"
      PI_CODEX_LB_MODEL: "${PI_CODEX_LB_MODEL:-gpt-5.6-sol}"
      PI_CODEX_LB_SECRET_FILE: /run/secrets/pi-unraid-codex-lb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - source: codex_lb_client
        target: pi-unraid-codex-lb
        mode: 0400
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/pi-unraid-service", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - type: bind
        source: /mnt/user/appdata/pi-unraid/home
        target: /home/pi
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/user/projects
        target: /projects
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/user/pi-worktrees
        target: /worktrees
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  codex_lb_client:
    file: "${PI_CODEX_LB_SECRET_SOURCE:-/mnt/user/appdata/pi-unraid/secrets/codex-lb.env}"
