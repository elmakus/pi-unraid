services:
  paseo:
    build:
      context: .
    image: pi-unraid:paseo
    user: "${PASEO_UID:-99}:${PASEO_GID:-100}"
    restart: unless-stopped
    stop_grace_period: 20s
    shm_size: "1gb"
    environment:
      TZ: Europe/Zurich
      PI_CODEX_LB_SECRET_FILE: /run/secrets/pi-unraid-codex-lb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - source: codex_lb_client
        target: pi-unraid-codex-lb
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: "${PASEO_HOME_HOST:-/mnt/user/appdata/pi-unraid/paseo-home}"
        target: /home/paseo
        bind:
          create_host_path: false
      - type: bind
        source: "${PASEO_PROJECTS_HOST:-/mnt/user/projects}"
        target: /projects
        bind:
          create_host_path: false
      - type: bind
        source: "${PASEO_WORKTREES_HOST:-/mnt/user/pi-worktrees}"
        target: /worktrees
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  codex_lb_client:
    file: "${PI_CODEX_LB_SECRET_SOURCE:-/mnt/user/appdata/pi-unraid/secrets/codex-lb.env}"
