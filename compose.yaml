services:
  paseo:
    build:
      context: .
    image: pi-unraid:paseo
    user: "${PASEO_UID:-99}:${PASEO_GID:-100}"
    restart: unless-stopped
    stop_grace_period: 20s
    shm_size: "1gb"
    environment:
      TZ: Europe/Zurich
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: "${PASEO_HOME_HOST:-/mnt/user/appdata/pi-unraid/paseo-home}"
        target: /home/paseo
        bind:
          create_host_path: false
      - type: bind
        source: "${PASEO_PROJECTS_HOST:-/mnt/user/projects}"
        target: /projects
        bind:
          create_host_path: false
      - type: bind
        source: "${PASEO_WORKTREES_HOST:-/mnt/user/pi-worktrees}"
        target: /worktrees
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
