finding = "OpenAI's current official model documentation declares 128000 max output tokens for GPT-6 Astra, Sol and Luna. Codex-LB v1.25.0-beta.9 and current upstream main omit those GPT-6 slugs from _V1_MAX_OUTPUT_TOKEN_OVERRIDES, while the live upstream model snapshot itself has no max_output_tokens field; therefore /v1/models emits null and Pi falls back to 16384. The minimal durable repair is to add the three GPT-6 slugs at 128000 in Codex-LB, preserving raw upstream max_output_tokens precedence if upstream later supplies it."
limitations = "This repair changes only advertised max output capability. The separate context-window/default-vs-maximum behavior remains outside this repair subject. Production activation requires a versioned downstream artifact or an upstream release containing the fix, plus rollback/readback evidence."
