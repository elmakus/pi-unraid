name: Paseo relay/doctor readiness (M06-T03 disposable evidence)

on:
  push:
    branches:
      - feat/paseo-gui-runtime
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - config/paseo-candidate.json
      - config/environment-capabilities.json
      - docs/PASEO_RELAY_AUTH.md
      - scripts/paseo_relay_doctor_readiness.py
      - scripts/paseo-relay-access.sh
      - scripts/configure-paseo-runtime.sh
      - scripts/verify-compose-foundation.sh
      - scripts/environment_capability_inventory.py
      - scripts/environment_capability_control.py
      - scripts/paseo_buildx.py
      - scripts/smoke_paseo_image.py
      - tests/test_paseo_relay_doctor_readiness_contract.py
      - tests/test_paseo_candidate_resolver.py
      - tests/test_paseo_child_image_contract.py
      - tests/test_paseo_runtime_contract.py
      - tests/test_paseo_relay_auth_contract.py
      - tests/test_pi_instruction_plane_contract.py
      - tests/test_pi_global_capabilities_contract.py
      - tests/test_unraid_graphql_host_control_contract.py
      - tests/test_unraid_host_control_guard_contract.py
      - tests/test_unraid_host_control_doctor_contract.py
      - tests/test_environment_capability_inventory_contract.py
      - tests/test_environment_capability_control_contract.py
      - tests/test_paseo_buildx_contract.py
      - tests/test_paseo_tower_build_contract.py
      - tests/test_paseo_staged_update_contract.py
      - tests/test_paseo_staged_home_evidence_contract.py
      - tests/test_paseo_rpc_workspace_contract.py
      - tests/test_paseo_browser_tool_compat_contract.py
      - .github/workflows/paseo-relay-doctor-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-doctor-readiness-disposable-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PI_UNRAID_BUILDX_BUILDER: pi-unraid-paseo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure persistent Buildx state location
        run: |
          STATE_DIR="$HOME/.local/share/pi-unraid/buildx"
          mkdir -p "$STATE_DIR"
          echo "DOCKER_CONFIG=$STATE_DIR" >> "$GITHUB_ENV"
          echo "PI_UNRAID_BUILDX_STATE_DIR=$STATE_DIR" >> "$GITHUB_ENV"
      - name: Verify exact M06-T03 predecessor bindings
        run: |
          test "$(git rev-parse 724d24e6d25d9a405998d8c6f48bbe65318ba4b4:implementation/workstreams/feature-paseo-gui-runtime/results/M06-T02.md)" = "13a49bd857c50b79213561ece74e06a585069d73"
          test "$(git rev-parse 0f8538f7d226c6c022b5070aeca42375ba2d751a:implementation/workstreams/feature-paseo-gui-runtime/results/M06-T01.md)" = "e01bd1dd4d84c94ec9b29f7bd1914e7160162d82"
          test "$(git rev-parse d70e95292c561ad7ca5491027a221a7c22177574:implementation/workstreams/feature-paseo-gui-runtime/results/M02-T02.md)" = "7b8574df581ace7e62125b8dc79fb48c1e491e7d"
          test "$(git rev-parse 727b6f25a3b957551d10c9c24d9e9d1e26efd6ab:implementation/workstreams/feature-paseo-gui-runtime/results/M02-T01.md)" = "e5075d474bb7aaf0583baf66757add56fb556253"
          test "$(git rev-parse affd83590ec534ed144b9048a2b9075434761f27:implementation/workstreams/feature-paseo-gui-runtime/results/M04-T01.md)" = "5173447ec3ab8775450a9defbf193aede63ca290"
          test "$(git rev-parse e9a412557bfbe927a64b1f7ba0d892f5f059e08a:implementation/workstreams/feature-paseo-gui-runtime/results/M04-T02.md)" = "c6adc8514548b701c3aa959df9f5a6f4ff581a9d"
      - name: Complete contract suite on this SHA
        run: |
          python3 -m unittest tests/test_paseo_relay_doctor_readiness_contract.py -v
          python3 -m unittest tests/test_paseo_candidate_resolver.py -v
          python3 -m unittest tests/test_paseo_child_image_contract.py -v
          python3 -m unittest tests/test_paseo_runtime_contract.py -v
          python3 -m unittest tests/test_paseo_relay_auth_contract.py -v
          python3 -m unittest tests/test_pi_instruction_plane_contract.py -v
          python3 -m unittest tests/test_pi_global_capabilities_contract.py -v
          python3 -m unittest tests/test_unraid_graphql_host_control_contract.py -v
          python3 -m unittest tests/test_unraid_host_control_guard_contract.py -v
          python3 -m unittest tests/test_unraid_host_control_doctor_contract.py -v
          python3 -m unittest tests/test_environment_capability_inventory_contract.py -v
          python3 -m unittest tests/test_environment_capability_control_contract.py -v
          python3 -m unittest tests/test_paseo_buildx_contract.py -v
          python3 -m unittest tests/test_paseo_tower_build_contract.py -v
          python3 -m unittest tests/test_paseo_staged_update_contract.py -v
          python3 -m unittest tests/test_paseo_staged_home_evidence_contract.py -v
          python3 -m unittest tests/test_paseo_rpc_workspace_contract.py -v
          python3 -m unittest tests/test_paseo_browser_tool_compat_contract.py -v
      - name: Static machine-readable readback
        run: |
          set -o pipefail
          python3 scripts/paseo_relay_doctor_readiness.py readback \
            --report /tmp/m06-t03-readback.json | tee /tmp/m06-t03-readback-out.json
          python3 - <<'EOF'
          import json
          r = json.load(open('/tmp/m06-t03-readback.json'))
          assert r['card'] == 'M06-T03', r['card']
          assert r['violations'] == [], r['violations']
          assert r['verdict'] == 'technical_green_ha_outstanding', r['verdict']
          assert r['full_green_claimed'] is False
          assert r['candidate']['candidate_id'] == 'sha256:b4e0c1e7c276371b84abd5c9aa7e325705b71349fe614b76855510dabf350b69'
          assert r['candidate']['frozen'] is True
          assert r['relay']['default_disabled'] is True
          assert r['relay']['consent_gate'] is True
          assert r['relay']['revocation_supported'] is False
          assert r['runtime_network']['public_ports'] == 0
          assert r['runtime_network']['ports_published'] is False
          assert r['inventory']['green_state'] == 'GREEN'
          assert r['inventory']['drift_state'] == 'RED'
          assert r['capability_control']['quick_state'] == 'GREEN'
          assert r['capability_control']['full_state'] == 'GREEN'
          assert r['healthcheck']['path'] == '/api/health'
          assert r['auth_fingerprints']['fingerprints_only'] is True
          assert len(r['ha_deferred']) == 14, len(r['ha_deferred'])
          print('readback verdict:', r['verdict'])
          EOF
      - name: Build frozen candidate image for the disposable flow
        run: |
          set -o pipefail
          python3 scripts/paseo_buildx.py build \
            --record /tmp/seed-record.json \
            --metadata /tmp/seed-metadata.json \
            --progress plain 2>&1 | tee /tmp/seed-build.log
          python3 scripts/paseo_buildx.py test --record /tmp/seed-record.json 2>&1 | tee /tmp/seed-test.log
          python3 -c "import json;r=json.load(open('/tmp/seed-record.json'));print('seed tag:',r['tag']);print('seed image:',r['image']['id'])"
      - name: Disposable relay/persistence/capability/doctor readiness flow
        run: |
          set -o pipefail
          TAG="$(python3 -c "import json;print(json.load(open('/tmp/seed-record.json'))['tag'])")"
          echo "SEED_TAG=$TAG" >> "$GITHUB_ENV"
          python3 scripts/paseo_relay_doctor_readiness.py flow \
            --scope disposable --image "$TAG" \
            --report /tmp/m06-t03-flow.json | tee /tmp/m06-t03-flow-out.json
          python3 - <<'EOF'
          import json
          import re
          r = json.load(open('/tmp/m06-t03-flow.json'))
          assert r['card'] == 'M06-T03', r['card']
          assert r['scope'] == 'disposable', r['scope']
          assert r['outcome'] == 'relay_doctor_readiness_green', r['outcome']
          assert r['full_green_claimed'] is False
          assert r['production_mutation'] is False
          phases = {p['name']: p for p in r['phases']}
          for name in ('fixture', 'image_labels', 'relay_fail_closed',
                       'synthetic_persistence', 'daemon_health_ports',
                       'recreate_survival', 'secret_safe_home', 'inventory_drift',
                       'reconcile_doctor', 'auth_fingerprints'):
              assert phases.get(name, {}).get('status') == 'ok', (name, phases)
          assert r['image']['candidate_id'] == 'sha256:b4e0c1e7c276371b84abd5c9aa7e325705b71349fe614b76855510dabf350b69'
          relay = phases['relay_fail_closed']['detail']
          assert relay['relay_default_disabled'] is True, relay
          assert relay['pair_fail_closed'] is True and relay['pair_code'] == 'RELAY_DISABLED', relay
          assert relay['consent_gate'] is True, relay
          assert relay['revocation_supported'] is False, relay
          synth = phases['synthetic_persistence']['detail']
          assert synth['relay_enabled_after_consent'] is True, synth
          assert synth['synthetic_identity'] is True and synth['real_phone_claimed'] is False, synth
          assert re.fullmatch(r'[0-9a-f]{64}', synth['keypair_sha_before']), synth
          assert synth['keypair_mode'] == '600', synth
          daemon = phases['daemon_health_ports']['detail']
          assert daemon['health'] == 'GREEN' and daemon['public_ports'] == 0, daemon
          assert daemon['health_path'] == '/api/health', daemon
          recreate = phases['recreate_survival']['detail']
          assert recreate['relay_enabled_after_recreate'] is True, recreate
          assert recreate['daemon_identity_persisted'] is True, recreate
          assert recreate['keypair_sha_after'] == synth['keypair_sha_before'], recreate
          assert recreate['markers_persisted'] is True, recreate
          assert recreate['public_ports_after_recreate'] == 0, recreate
          home = phases['secret_safe_home']['detail']
          assert home['home_secret_free'] is True, home
          assert home['keypair_contents_captured'] is False, home
          assert home['pairing_offer_logged'] is False, home
          inv = phases['inventory_drift']['detail']
          assert inv['green_state'] == 'GREEN' and inv['drift_state'] == 'RED', inv
          assert inv['unexpected_deleted'] == 0, inv
          rec = phases['reconcile_doctor']['detail']
          assert rec['reconcile_actions'] == ['node', 'pi'], rec
          assert rec['reconcile_approved_only'] is True, rec
          assert rec['restored_state'] == 'WARN', rec
          assert rec['unexpected_disappeared_fails_red'] is True, rec
          assert rec['quick_state'] == 'GREEN' and rec['full_state'] == 'GREEN', rec
          assert rec['drifted_full_state'] == 'RED', rec
          auth = phases['auth_fingerprints']['detail']
          assert auth['fingerprints_only'] is True, auth
          assert auth['credential_material_captured'] is False, auth
          print('flow outcome:', r['outcome'])
          print('image:', r['image']['id'])
          EOF
      - name: Fail-closed guards refuse production scope
        run: |
          set +e
          python3 scripts/paseo_relay_doctor_readiness.py flow \
            --scope production --image "$SEED_TAG" >/tmp/m06-t03-production-out.txt 2>&1
          test "$?" -ne 0
          set -e
          grep -i "refusing non-disposable scope" /tmp/m06-t03-production-out.txt
      - name: Prove disposable scope and production untouched
        if: always()
        run: |
          test ! -e /mnt/user/appdata/pi-unraid
          test -z "$(docker ps -q --filter ancestor="$SEED_TAG")"
          docker ps -a --format '{{.Names}} {{.Image}}'
      - name: Upload relay-doctor-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paseo-relay-doctor-readiness-evidence
          path: |
            /tmp/seed-record.json
            /tmp/seed-metadata.json
            /tmp/seed-build.log
            /tmp/seed-test.log
            /tmp/m06-t03-readback.json
            /tmp/m06-t03-flow.json
            /tmp/m06-t03-flow-out.json
            /tmp/m06-t03-production-out.txt
