name: Paseo staged update/cutover/rollback (disposable evidence)

on:
  push:
    branches:
      - feat/paseo-gui-runtime
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - config/paseo-candidate.json
      - config/environment-capabilities.json
      - config/pi-agent/**
      - scripts/paseo_staged_update.py
      - scripts/paseo_staged_home_evidence.py
      - scripts/paseo_buildx.py
      - scripts/paseo_tower_build.py
      - scripts/smoke_paseo_image.py
      - scripts/verify-compose-foundation.sh
      - scripts/verify-pi-instruction-plane.sh
      - scripts/verify-pi-global-capabilities.sh
      - scripts/configure-paseo-runtime.sh
      - tests/test_paseo_staged_update_contract.py
      - tests/test_paseo_staged_home_evidence_contract.py
      - tests/test_paseo_buildx_contract.py
      - tests/test_paseo_tower_build_contract.py
      - tests/test_paseo_candidate_resolver.py
      - tests/test_paseo_child_image_contract.py
      - tests/test_paseo_runtime_contract.py
      - tests/test_paseo_relay_auth_contract.py
      - tests/test_pi_instruction_plane_contract.py
      - tests/test_pi_global_capabilities_contract.py
      - tests/test_unraid_graphql_host_control_contract.py
      - tests/test_unraid_host_control_guard_contract.py
      - tests/test_unraid_host_control_doctor_contract.py
      - tests/test_environment_capability_inventory_contract.py
      - tests/test_environment_capability_control_contract.py
      - .github/workflows/paseo-staged-update.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-update-disposable-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PI_UNRAID_BUILDX_BUILDER: pi-unraid-paseo
      STAGED: /tmp/pi-unraid-staged
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure persistent Buildx state location
        run: |
          STATE_DIR="$HOME/.local/share/pi-unraid/buildx"
          mkdir -p "$STATE_DIR"
          echo "DOCKER_CONFIG=$STATE_DIR" >> "$GITHUB_ENV"
          echo "PI_UNRAID_BUILDX_STATE_DIR=$STATE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$STAGED/home" "$STAGED/projects" "$STAGED/worktrees" \
            "$STAGED/state" /tmp/staged-tower/buildx
      - name: Verify exact M05-T03 predecessor bindings
        run: |
          test "$(git rev-parse b7aa565649d14168e0d4b2d2d06044c08aac46a0:implementation/workstreams/feature-paseo-gui-runtime/results/M05-T02B.md)" = "7bdb9fffcbada5f0dc6475f3bb2b7be92d8e1d20"
          test "$(git rev-parse 40ad9529f7f3bb05a27caa306d21a3cdc83c5bcd:implementation/workstreams/feature-paseo-gui-runtime/results/M05-T01-R02.md)" = "7b3855238c59f35f2cd2af05a0d1456db34832db"
          test "$(git rev-parse 727b6f25a3b957551d10c9c24d9e9d1e26efd6ab:implementation/workstreams/feature-paseo-gui-runtime/results/M02-T01.md)" = "e5075d474bb7aaf0583baf66757add56fb556253"
          test "$(git rev-parse e9a412557bfbe927a64b1f7ba0d892f5f059e08a:implementation/workstreams/feature-paseo-gui-runtime/results/M04-T02.md)" = "c6adc8514548b701c3aa959df9f5a6f4ff581a9d"
      - name: Complete contract suite on this SHA
        run: |
          python3 -m unittest tests/test_paseo_staged_update_contract.py -v
          python3 -m unittest tests/test_paseo_staged_home_evidence_contract.py -v
          python3 -m unittest tests/test_paseo_buildx_contract.py -v
          python3 -m unittest tests/test_paseo_tower_build_contract.py -v
          python3 -m unittest tests/test_paseo_candidate_resolver.py -v
          python3 -m unittest tests/test_paseo_child_image_contract.py -v
          python3 -m unittest tests/test_paseo_runtime_contract.py -v
          python3 -m unittest tests/test_paseo_relay_auth_contract.py -v
          python3 -m unittest tests/test_pi_instruction_plane_contract.py -v
          python3 -m unittest tests/test_pi_global_capabilities_contract.py -v
          python3 -m unittest tests/test_unraid_graphql_host_control_contract.py -v
          python3 -m unittest tests/test_unraid_host_control_guard_contract.py -v
          python3 -m unittest tests/test_unraid_host_control_doctor_contract.py -v
          python3 -m unittest tests/test_environment_capability_inventory_contract.py -v
          python3 -m unittest tests/test_environment_capability_control_contract.py -v
      - name: Build frozen candidate image for the disposable seed
        run: |
          python3 scripts/paseo_buildx.py build \
            --record /tmp/seed-record.json \
            --metadata /tmp/seed-metadata.json \
            --progress plain 2>&1 | tee /tmp/seed-build.log
          python3 scripts/paseo_buildx.py test --record /tmp/seed-record.json 2>&1 | tee /tmp/seed-test.log
          python3 scripts/paseo_tower_build.py --root /tmp/staged-tower/buildx --boundary /tmp/staged-tower \
            retain --record /tmp/seed-record.json --max 5
          python3 -c "import json;r=json.load(open('/tmp/seed-record.json'));print('seed tag:',r['tag']);print('seed image:',r['image']['id'])"
      - name: Prepare disposable persistent HOME fixture
        run: |
          TAG="$(python3 -c "import json;print(json.load(open('/tmp/seed-record.json'))['tag'])")"
          echo "SEED_TAG=$TAG" >> "$GITHUB_ENV"
          docker run --rm --user 0:0 --entrypoint chown \
            -v "$STAGED:/fixture" \
            "$TAG" 99:100 /fixture/home /fixture/projects /fixture/worktrees
          bash scripts/configure-paseo-runtime.sh "$TAG" "$STAGED/home" "$STAGED/worktrees" 99 100
          python3 scripts/paseo_staged_home_evidence.py seed \
            --home-host "$STAGED/home" --tag "$TAG" \
            --sentinel-text "$GITHUB_RUN_ID:$GITHUB_SHA" \
            --out "$STAGED/home-seed-manifest.json"
      - name: Seed disposable active/rollback anchors
        run: |
          python3 scripts/paseo_staged_update.py --scope disposable init \
            --state-root "$STAGED/state" \
            --tower-root /tmp/staged-tower/buildx \
            --home-host "$STAGED/home" \
            --projects-host "$STAGED/projects" \
            --worktrees-host "$STAGED/worktrees" | tee /tmp/staged-init.json
          python3 scripts/paseo_staged_update.py --scope disposable readback \
            --state-root "$STAGED/state" \
            --tower-root /tmp/staged-tower/buildx \
            --home-host "$STAGED/home" \
            --projects-host "$STAGED/projects" \
            --worktrees-host "$STAGED/worktrees" | tee "$STAGED/readback-before.json"
      - name: Successful staged transaction promotes with exact readback
        run: |
          cp "$STAGED/state/active.json" /tmp/staged-active-before.json
          python3 scripts/paseo_staged_update.py --scope disposable update \
            --state-root "$STAGED/state" \
            --tower-root /tmp/staged-tower/buildx \
            --home-host "$STAGED/home" \
            --projects-host "$STAGED/projects" \
            --worktrees-host "$STAGED/worktrees" \
            --buildx-state-dir "$PI_UNRAID_BUILDX_STATE_DIR" \
            --record "$STAGED/staged-success.json" | tee /tmp/staged-success-out.json
          python3 - <<'EOF'
          import json
          r = json.load(open('/tmp/pi-unraid-staged/staged-success.json'))
          assert r['outcome'] == 'promoted', r['outcome']
          assert r['recovery']['decision'] == 'promoted', r['recovery']
          assert r['phase_order'] == ['preflight', 'build', 'fast_checks', 'temp_smoke',
                                      'promote', 'post_smoke', 'rollback'], r['phase_order']
          for name in ('preflight', 'build', 'fast_checks', 'temp_smoke', 'promote', 'post_smoke'):
              assert r['phases'][name]['status'] == 'ok', (name, r['phases'][name])
          assert r['new_image']['id'], r['new_image']
          print('promoted image:', r['new_image']['id'])
          EOF
          python3 scripts/paseo_staged_update.py --scope disposable readback \
            --state-root "$STAGED/state" \
            --tower-root /tmp/staged-tower/buildx \
            --home-host "$STAGED/home" \
            --projects-host "$STAGED/projects" \
            --worktrees-host "$STAGED/worktrees" | tee "$STAGED/readback-after-success.json"
          python3 scripts/paseo_staged_home_evidence.py verify \
            --home-host "$STAGED/home" --tag "$SEED_TAG" \
            --manifest "$STAGED/home-seed-manifest.json" \
            --report "$STAGED/home-after-success.json"
      - name: Injected pre-smoke failure leaves active runtime untouched
        run: |
          sha256sum "$STAGED/state/active.json" | tee /tmp/staged-active-prefail.sha
          set +e
          PI_UNRAID_STAGED_FORCE_TEMP_SMOKE_FAIL=1 \
          python3 scripts/paseo_staged_update.py --scope disposable update \
            --state-root "$STAGED/state" \
            --tower-root /tmp/staged-tower/buildx \
            --home-host "$STAGED/home" \
            --projects-host "$STAGED/projects" \
            --worktrees-host "$STAGED/worktrees" \
            --buildx-state-dir "$PI_UNRAID_BUILDX_STATE_DIR" \
            --record "$STAGED/staged-prefail.json" | tee /tmp/staged-prefail-out.json
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          python3 - <<'EOF'
          import json
          r = json.load(open('/tmp/pi-unraid-staged/staged-prefail.json'))
          assert r['outcome'] == 'failed', r['outcome']
          assert r['recovery']['decision'] == 'no_mutation', r['recovery']
          assert r['recovery']['trigger'] == 'temp_smoke', r['recovery']
          assert r['phases']['temp_smoke']['status'] == 'failed', r['phases']['temp_smoke']
          for name in ('promote', 'post_smoke', 'rollback'):
              assert r['phases'][name]['status'] == 'skipped', (name, r['phases'][name])
          EOF
          sha256sum -c /tmp/staged-active-prefail.sha
          python3 scripts/paseo_staged_home_evidence.py verify \
            --home-host "$STAGED/home" --tag "$SEED_TAG" \
            --manifest "$STAGED/home-seed-manifest.json" \
            --report "$STAGED/home-after-prefail.json"
      - name: Injected post-smoke failure restores prior coherent runtime
        run: |
          set +e
          PI_UNRAID_STAGED_FORCE_POST_SMOKE_FAIL=1 \
          python3 scripts/paseo_staged_update.py --scope disposable update \
            --state-root "$STAGED/state" \
            --tower-root /tmp/staged-tower/buildx \
            --home-host "$STAGED/home" \
            --projects-host "$STAGED/projects" \
            --worktrees-host "$STAGED/worktrees" \
            --buildx-state-dir "$PI_UNRAID_BUILDX_STATE_DIR" \
            --record "$STAGED/staged-postfail.json" | tee /tmp/staged-postfail-out.json
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          python3 - <<'EOF'
          import json
          r = json.load(open('/tmp/pi-unraid-staged/staged-postfail.json'))
          assert r['outcome'] == 'rolled_back', r['outcome']
          assert r['recovery']['decision'] == 'rolled_back', r['recovery']
          assert r['recovery']['trigger'] == 'post_smoke', r['recovery']
          assert r['phases']['post_smoke']['status'] == 'failed', r['phases']['post_smoke']
          assert r['phases']['rollback']['status'] == 'ok', r['phases']['rollback']
          assert r['phases']['rollback']['detail']['observed']['home_preserved'] is True
          EOF
          python3 scripts/paseo_staged_update.py --scope disposable readback \
            --state-root "$STAGED/state" \
            --tower-root /tmp/staged-tower/buildx \
            --home-host "$STAGED/home" \
            --projects-host "$STAGED/projects" \
            --worktrees-host "$STAGED/worktrees" | tee "$STAGED/readback-after-rollback.json"
          python3 scripts/paseo_staged_home_evidence.py verify \
            --home-host "$STAGED/home" --tag "$SEED_TAG" \
            --manifest "$STAGED/home-seed-manifest.json" \
            --report "$STAGED/home-after-postfail.json"
      - name: Fail-closed guards and readback idempotence
        run: |
          set +e
          python3 scripts/paseo_staged_update.py --scope production update \
            --state-root "$STAGED/state" \
            --tower-root /tmp/staged-tower/buildx \
            --home-host "$STAGED/home" \
            --projects-host "$STAGED/projects" \
            --worktrees-host "$STAGED/worktrees" >/tmp/staged-production-out.txt 2>&1
          test "$?" -eq 2
          set -e
          grep -i "M07" /tmp/staged-production-out.txt
          for i in 1 2; do
            python3 scripts/paseo_staged_update.py --scope disposable readback \
              --state-root "$STAGED/state" \
              --tower-root /tmp/staged-tower/buildx \
              --home-host "$STAGED/home" \
              --projects-host "$STAGED/projects" \
              --worktrees-host "$STAGED/worktrees" > "/tmp/staged-readback-$i.json"
          done
          cmp /tmp/staged-readback-1.json /tmp/staged-readback-2.json
      - name: Show machine-readable phase and recovery summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, json
          for path in sorted(glob.glob('/tmp/pi-unraid-staged/staged-*.json')):
              r = json.load(open(path))
              phases = {k: (v['status'], v['duration_ms']) for k, v in r['phases'].items()}
              print(path, 'outcome=' + r['outcome'], 'recovery=' + json.dumps(r['recovery'], sort_keys=True))
              print('  phases=' + json.dumps(phases, sort_keys=True))
          EOF
      - name: Prove disposable scope and production untouched
        if: always()
        run: |
          test ! -e /mnt/user/appdata/pi-unraid
          docker compose ls
          docker ps -a --format '{{.Names}} {{.Image}}'
          echo "--- staged projects only ---"
          docker compose ls --format json | tee /tmp/staged-projects.json
          python3 - <<'EOF'
          import json
          rows = json.load(open('/tmp/staged-projects.json'))
          names = [row.get('Name', '') for row in rows]
          assert names, names
          assert all(name.startswith('pi-unraid-staged-') for name in names), names
          print('\n'.join(names))
          EOF
      - name: Disposable cleanup
        if: always()
        run: |
          for project in $(docker compose ls --format json 2>/dev/null | python3 -c "import json,sys; print(' '.join(r.get('Name','') for r in json.load(sys.stdin) if r.get('Name','').startswith('pi-unraid-staged-')))" || true); do
            docker compose -p "$project" -f compose.yaml down -v || true
          done
          docker compose -p pi-unraid-staged-active -f compose.yaml -f "$STAGED/state/active.override.yaml" down -v || true
          docker ps -a --format '{{.Names}}'
      - name: Upload staged-update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paseo-staged-update-evidence
          path: |
            /tmp/seed-record.json
            /tmp/seed-metadata.json
            /tmp/seed-build.log
            /tmp/seed-test.log
            /tmp/staged-init.json
            /tmp/staged-success-out.json
            /tmp/staged-prefail-out.json
            /tmp/staged-postfail-out.json
            /tmp/staged-production-out.txt
            /tmp/staged-readback-1.json
            /tmp/staged-active-before.json
            /tmp/pi-unraid-staged/staged-success.json
            /tmp/pi-unraid-staged/staged-prefail.json
            /tmp/pi-unraid-staged/staged-postfail.json
            /tmp/pi-unraid-staged/readback-before.json
            /tmp/pi-unraid-staged/readback-after-success.json
            /tmp/pi-unraid-staged/readback-after-rollback.json
            /tmp/pi-unraid-staged/home-seed-manifest.json
            /tmp/pi-unraid-staged/home-after-success.json
            /tmp/pi-unraid-staged/home-after-prefail.json
            /tmp/pi-unraid-staged/home-after-postfail.json
